name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  # Gates the deploy below. On pull requests ci.yml already runs the same
  # reusable workflow, so running it here too built the docs twice per event.
  docs-check:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/docs.yml

  deploy-gh-pages:
    needs: docs-check
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # `mike deploy --push` writes to the docs_dev branch, so two deploys racing
    # each other make the later one fail to lock the ref. Serialize them.
    # Scoped to this job so pull request docs-check runs stay parallel.
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # See docs.yml: silences the properdocs notice pulled in by the nav and
      # page generation plugins.
      DISABLE_MKDOCS_2_WARNING: "true"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --locked --no-default-groups --group docs

      # Same cache as the docs check: social cards and the external assets the
      # privacy plugin downloads, so a deploy does not re-fetch them.
      - name: Restore social card and external asset cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: mkdocs-material-${{ hashFiles('mkdocs.yml', 'docs/**') }}
          restore-keys: mkdocs-material-

      - name: Deploy docs as dev
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run mike deploy --push --update-aliases dev

      - name: Deploy versioned docs and update latest
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run mike deploy --push --update-aliases "$VERSION" latest
          uv run mike set-default --push latest
